<nav class="bottom-navbar">


  <a
    class="nav-item home-item"
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">

    <span class="nav-icon-wrap">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon">

        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>

      </svg>
    </span>

    <span class="label">
      მთავარი
    </span>

  </a>




  <ng-container *ngIf="isLoggedIn">


    <div
      class="add-menu"
      [class.open]="isAddMenuOpen">

      <div
        class="add-backdrop"
        *ngIf="isAddMenuOpen"
        (click)="closeAddMenu()">
      </div>


      <!-- ============================== -->
      <!-- ACTIONS -->
      <!-- ============================== -->

      <div class="add-options">

     
        <button
          type="button"
          class="add-option listings-option"
          (click)="navigateToAllListings()">

          <span class="option-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">

              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>

            </svg>
          </span>

          <span class="option-content">
            <strong>განცხადებები</strong>
            <small>ყველა გზავნილი და რეისი</small>
          </span>

        </button>

        <button
          type="button"
          class="add-option send-option"
          (click)="navigateToDashboard()">

          <span class="option-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>

            </svg>
          </span>

          <span class="option-content">
            <strong>გაგზავნა</strong>
            <small>გზავნილის დამატება</small>
          </span>

        </button>


        <!-- ADD RIDE -->

        <button
          type="button"
          class="add-option ride-option"
          (click)="navigateToAddRide()">

          <span class="option-icon">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">

              <rect
                x="1"
                y="6"
                width="15"
                height="12"
                rx="2">
              </rect>

              <path d="M16 10h4l3 3v5h-7z"></path>

              <circle cx="6" cy="18" r="2"></circle>
              <circle cx="18" cy="18" r="2"></circle>

            </svg>

          </span>

          <span class="option-content">
            <strong>რეისი</strong>
            <small>მგზავრობის დამატება</small>
          </span>

        </button>

      </div>


      <!-- ============================== -->
      <!-- PLUS BUTTON -->
      <!-- ============================== -->

      <button
        type="button"
        class="plus-button"
        [class.open]="isAddMenuOpen"
        (click)="toggleAddMenu()"
        [attr.aria-expanded]="isAddMenuOpen"
        aria-label="დამატება">

        <span class="plus-circle">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            class="plus-icon">

            <line
              x1="12"
              y1="5"
              x2="12"
              y2="19">
            </line>

            <line
              x1="5"
              y1="12"
              x2="19"
              y2="12">
            </line>

          </svg>

        </span>

        <span class="plus-label">
          დამატება
        </span>

      </button>

    </div>


    <!-- ============================== -->
    <!-- PROFILE -->
    <!-- ============================== -->

    <a
      class="nav-item profile-item"
      routerLink="/profile"
      routerLinkActive="active">

      <span class="profile-avatar">
        {{ getUserInitials() }}
      </span>

      <span class="label">
        პროფილი
      </span>

    </a>

  </ng-container>


  <!-- ====================================== -->
  <!-- GUEST USER -->
  <!-- ====================================== -->

  <ng-container *ngIf="!isLoggedIn">

    <!-- HOW IT WORKS -->

    <a
      class="nav-item"
      routerLink="/howtowork"
      routerLinkActive="active">

      <span class="nav-icon-wrap">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon">

          <circle cx="12" cy="12" r="10"></circle>

          <path
            d="M9.09 9a3 3 0 1 1 5.83 1c0 2-3 3-3 3">
          </path>

          <line
            x1="12"
            y1="17"
            x2="12.01"
            y2="17">
          </line>

        </svg>

      </span>

      <span class="label">
        როგორ მუშაობს
      </span>

    </a>


    <!-- RULES -->

    <a
      class="nav-item"
      routerLink="/rules"
      routerLinkActive="active">

      <span class="nav-icon-wrap">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon">

          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z">
          </path>

          <polyline points="14 2 14 8 20 8"></polyline>

        </svg>

      </span>

      <span class="label">
        წესები
      </span>

    </a>


    <!-- LOGIN -->

    <a
      class="nav-item"
      routerLink="/android-login"
      routerLinkActive="active">

      <span class="nav-icon-wrap">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon">

          <path
            d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2">
          </path>

          <circle
            cx="12"
            cy="7"
            r="4">
          </circle>

        </svg>

      </span>

      <span class="label">
        შესვლა
      </span>

    </a>

  </ng-container>

</nav>
