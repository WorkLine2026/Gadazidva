<nav class="navbar">
  <div class="nav-container">
    <div class="logo" (click)="navigateHome()">
      <div class="logo-icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
          <polyline points="17 11 21 7 17 3"></polyline>
          <line x1="21" y1="7" x2="9" y2="7"></line>
          <polyline points="7 13 3 17 7 21"></polyline>
          <line x1="3" y1="17" x2="15" y2="17"></line>
        </svg>
      </div>
      <span class="logo-text">Ggzavna<span class="highlight">.ge</span></span>
    </div>

    <button 
      class="hamburger" 
      [class.active]="isMenuOpen"
      #hamburger
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-wrapper" [class.active]="isMenuOpen" #navWrapper>
      <ul class="nav-links">
        <li>
          <a 
            routerLink="/" 
            routerLinkActive="active" 
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()">
            მთავარი
          </a>
        </li>
        <li>
          <a 
            routerLink="/howtowork" 
            routerLinkActive="active"
            (click)="closeMenu()">
            როგორ მუშაობს
          </a>
        </li>

    <li>
          <a 
            routerLink="/rules" 
            routerLinkActive="active"
            (click)="navigateTosupport()">
            კონტაქტი
          </a>
        </li>
        
        <li>
          <a 
            routerLink="/rules" 
            routerLinkActive="active"
            (click)="closeMenu()">
            წესები
          </a>
        </li>
      </ul>
    <button 
  class="btn btn-register" 
  (click)="navigateToAllListings()">
  ყველა განცხადება
</button>
      <div class="nav-actions">
        <ng-container *ngIf="!isLoggedIn">
          <button 
            class="btn btn-signin" 
            (click)="navigateToLogin()">
            შესვლა
          </button>

          <button 
            class="btn btn-register" 
            (click)="navigateToRegister()">
            რეგისტრაცია
          </button>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <button 
            class="btn btn-primary" 
            (click)="navigateToDashboard()">
            გაგზავნა
          </button>

          <button 
            class="btn btn-secondary" 
            (click)="navigateToAddRide()">
            რეისის დამატება
          </button>

          <button 
            class="profile-avatar-btn" 
            (click)="navigateToProfile()"
            [attr.aria-label]="'პროფილი'">
            <span class="profile-avatar">{{ getUserInitials() }}</span>
          </button>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- 🚚 დეკორატიული მარშრუტი — მანქანა მუდმივად "მიდის" ნავბარის ქვედა კიდეზე -->
  <div class="nav-road" aria-hidden="true">
    <span class="nav-road__track"></span>
    <span class="nav-road__car-wrap">
      <svg class="nav-road__car" viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="navCarBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#1d4ed8"/>
          </linearGradient>
        </defs>
        <rect x="1" y="5" width="23" height="9" rx="2.2" fill="url(#navCarBody)"/>
        <path d="M24 8.5H31.5L36 12.2V14H24V8.5Z" fill="url(#navCarBody)"/>
        <rect x="27" y="9.2" width="5.2" height="4" rx="1" fill="#ffffff" opacity="0.9"/>
        <rect x="1" y="5" width="23" height="2.4" rx="1.2" fill="#f97316" opacity="0.85"/>
        <circle cx="9" cy="15.5" r="3" fill="#1a202c"/>
        <circle cx="30" cy="15.5" r="3" fill="#1a202c"/>
        <circle cx="9" cy="15.5" r="1.1" fill="#cbd5e0"/>
        <circle cx="30" cy="15.5" r="1.1" fill="#cbd5e0"/>
      </svg>
    </span>
  </div>
</nav>
