<div class="admin-login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="tag-icon">🏷️</div>
      <h1>Gagzavna <span>Admin</span></h1>
      <p class="subtitle">ადმინისტრატორის პანელში შესასვლელად გაიარეთ ავტორიზაცია</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">ელფოსტა</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin@example.com"
          autocomplete="username"
          [disabled]="isLoading"
          required />
      </div>

      <div class="form-group">
        <label for="password">პაროლი</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [disabled]="isLoading"
            required />
          <button
            type="button"
            class="toggle-visibility"
            (click)="togglePasswordVisibility()"
            tabindex="-1">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        ⚠️ {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="isLoading || loginForm.invalid">
        <span *ngIf="!isLoading">შესვლა</span>
        <span *ngIf="isLoading" class="spinner">⏳ იტვირთება...</span>
      </button>
    </form>
  </div>
</div>
