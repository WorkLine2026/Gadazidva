<div class="wrap">
  <form class="box" (ngSubmit)="submit()">
    <h1>Ggzavna · ადმინი</h1>
    <p class="sub">შედი ადმინისტრატორის ანგარიშით</p>

    <label for="email">ელფოსტა</label>
    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      autocomplete="username"
      required
      autofocus
    />

    <label for="password">პაროლი</label>
    <div class="pw">
      <input
        id="password"
        [type]="show ? 'text' : 'password'"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
      <button type="button" class="eye" (click)="show = !show">{{ show ? '🙈' : '👁️' }}</button>
    </div>

    <div class="err" *ngIf="error">{{ error }}</div>

    <button class="go" type="submit" [disabled]="loading || !email || !password">
      {{ loading ? 'იტვირთება...' : 'შესვლა' }}
    </button>
  </form>
</div>
