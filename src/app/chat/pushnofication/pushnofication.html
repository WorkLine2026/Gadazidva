<div class="toast-stack" aria-live="polite" role="status">
  <div
    *ngFor="let toast of toasts(); trackBy: trackById"
    class="toast toast--{{ accentFor(toast.data.type) }}"
    [class.is-paused]="toast.paused"
    (click)="onToastClick(toast)"
    (mouseenter)="pause(toast)"
    (mouseleave)="resume(toast)"
  >
    <div class="toast__icon">
      <ng-container [ngSwitch]="iconFor(toast.data.type)">

        <svg *ngSwitchCase="'box'" viewBox="0 0 24 24" fill="none">
          <path d="M3 8l9-4 9 4-9 4-9-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M3 8v8l9 4 9-4V8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 12v8" stroke="currentColor" stroke-width="1.6"/>
        </svg>

        <svg *ngSwitchCase="'check'" viewBox="0 0 24 24" fill="none">
          <path d="M4 12.5l5 5L20 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <svg *ngSwitchCase="'x'" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>

        <svg *ngSwitchCase="'flag'" viewBox="0 0 24 24" fill="none">
          <path d="M5 21V4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M5 4h13l-3 4 3 4H5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>

        <svg *ngSwitchCase="'truck'" viewBox="0 0 24 24" fill="none">
          <path d="M3 7h11v9H3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M14 10h4l3 3v3h-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="7" cy="18" r="1.6" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="17" cy="18" r="1.6" stroke="currentColor" stroke-width="1.4"/>
        </svg>

        <svg *ngSwitchCase="'chat'" viewBox="0 0 24 24" fill="none">
          <path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>

        <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none">
          <path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 3h16l-2-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M10 21a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>

      </ng-container>
    </div>

    <div class="toast__body">
      <p class="toast__title">{{ toast.data.title }}</p>
      <p class="toast__text">{{ toast.data.body }}</p>
    </div>

    <button
      type="button"
      class="toast__close"
      (click)="dismiss(toast.id); $event.stopPropagation()"
      aria-label="დახურვა"
    >
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="toast__timer"></div>
  </div>
</div>
