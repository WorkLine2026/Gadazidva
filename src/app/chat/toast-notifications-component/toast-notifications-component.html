<div class="toast-stack">
  <div
    class="toast-card"
    *ngFor="let toast of toasts"
    (click)="openChat(toast)">

    <div class="toast-top-row">
      <div class="toast-app-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 11 21 7 17 3"></polyline>
          <line x1="21" y1="7" x2="9" y2="7"></line>
          <polyline points="7 13 3 17 7 21"></polyline>
          <line x1="3" y1="17" x2="15" y2="17"></line>
        </svg>
      </div>
      <span class="toast-app-name">Ggzavna.ge</span>
      <span class="toast-dot">•</span>
      <span class="toast-time">ახლა</span>
      <button class="toast-close" (click)="$event.stopPropagation(); dismiss(toast.id)">✕</button>
    </div>

    <div class="toast-main">
      <div class="toast-avatar">{{ getInitials(toast.message.senderName) }}</div>
      <div class="toast-body">
        <div class="toast-title">{{ toast.message.senderName }}</div>
        <div class="toast-text">{{ toast.message.message }}</div>
      </div>
    </div>
  </div>
</div>
